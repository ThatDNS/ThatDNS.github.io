{{- define "main" }}

<style>
body {
    overflow: hidden;
}

.hero-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    padding: 2rem;
}

.typing-text {
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 700;
    margin-bottom: 3rem;
    font-family: var(--font-mono, monospace);
    border-right: 3px solid var(--primary);
    white-space: nowrap;
    overflow: hidden;
    display: inline-block;
    animation: typing 3.5s steps(18) 1s forwards, blink 0.75s step-end infinite;
    max-width: fit-content;
}

@keyframes typing {
    from {
        max-width: 0;
    }
    to {
        max-width: 100%;
    }
}

@keyframes blink {
    from, to {
        border-color: transparent;
    }
    50% {
        border-color: var(--primary);
    }
}

.social-icons {
    display: flex;
    gap: 20px;
    opacity: 0;
    animation: fadeIn 1s ease-in 1s forwards;
}

.social-icons a {
    color: var(--primary);
    transition: transform 0.2s, opacity 0.2s;
    display: inline-flex;
    align-items: center;
}

.social-icons a:hover {
    transform: translateY(-3px);
    opacity: 0.8;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

@media (max-width: 768px) {
    .typing-text {
        white-space: normal;
        animation: none;
        width: auto;
        border-right: none;
        text-align: center;
    }
    
    .social-icons {
        animation: fadeIn 1s ease-in 1s forwards;
    }
}
</style>

<div class="hero-container">
    <h1 class="typing-text">Hello, DNS here.</h1>
    
    <div class="social-icons">
        {{- partial "social_links.html" (dict "size" 32) -}}
    </div>
</div>

{{- end }}{{/* end main */}}
