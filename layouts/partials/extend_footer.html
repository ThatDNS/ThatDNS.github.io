{{- if not .IsHome }}
<style>
.social-footer {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 0 0 20px 0;
    padding: 0;
}

.social-footer a {
    color: var(--primary);
    transition: transform 0.2s;
    display: inline-flex;
    align-items: center;
}

.social-footer a:hover {
    transform: translateY(-2px);
}
</style>

<div class="social-footer">
    {{- partial "social_links.html" (dict "size" 24) -}}
</div>
{{- end }}
